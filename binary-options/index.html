<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Pixelune Trader</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="phone" id="phone" data-view="trade">
      <!-- Cabeçalho normal -->
      <header class="hdr">
        <div class="logo">PX</div>
        <div class="acct">
          <div class="acct-type">Demo account</div>
          <div class="acct-bal" data-bind="balance">10,000.00 EUR</div>
        </div>
        <button class="btn-real" id="reset-btn">Reset</button>
      </header>

      <!-- Cabeçalho do modo de ecrã inteiro -->
      <header class="hdr-fs">
        <span class="sym-ico" data-bind="symIcon"></span>
        <div class="hdr-fs-sym">
          <div class="sym-name" data-bind="symName"></div>
          <div class="sym-sub" data-bind="tradeTypeName"></div>
        </div>
        <div class="acct acct-right">
          <div class="acct-type">Demo account</div>
          <div class="acct-bal" data-bind="balance"></div>
        </div>
      </header>

      <main class="view trade-view">
        <div class="sym-row">
          <button class="plus-btn" id="plus-btn" aria-label="Add"></button>
          <button class="sym-box" id="sym-box">
            <span class="sym-ico" data-bind="symIcon"></span>
            <span class="sym-text">
              <span class="sym-name" data-bind="symName"></span>
              <span class="sym-sub"><span data-bind="tradeTypeName"></span><i class="chev"></i></span>
            </span>
          </button>
        </div>

        <div class="chart" id="chart">
          <button class="pl-pill" id="pl-pill" hidden>
            <span class="pl-count" id="pl-count">1</span>
            <span class="pl-label">P/L</span>
            <span class="pl-value" id="pl-value">€0.00</span>
            <i class="chev"></i>
          </button>
          <div class="chart-ctl">
            <button class="round-btn" id="chart-menu" aria-label="Chart settings"></button>
            <span class="interval-tag" id="interval-tag">1t</span>
          </div>
          <button class="round-btn expand-btn" id="expand-btn" aria-label="Full screen"></button>
        </div>

        <section class="panel">
          <div class="seg" id="dir-seg">
            <button data-dir="up" class="on"><span data-bind="upLabel">Up</span></button>
            <button data-dir="down"><span data-bind="downLabel">Down</span></button>
          </div>
          <div class="cards">
            <button class="card" id="card-1"><span class="card-label"></span><span class="card-value"></span></button>
            <button class="card" id="card-2"><span class="card-label"></span><span class="card-value"></span></button>
            <button class="card" id="card-3"><span class="card-label"></span><span class="card-value"></span></button>
          </div>
          <button class="buy-btn" id="buy-btn">Buy</button>
        </section>
      </main>

      <main class="view positions-view">
        <div class="tabs" id="pos-tabs">
          <button data-tab="open" class="on">Open</button>
          <button data-tab="closed">Closed</button>
        </div>
        <div class="pos-total">
          <span>Total profit/loss:</span>
          <span id="pos-total">0.00 EUR</span>
        </div>
        <div class="pos-list" id="pos-list"></div>
      </main>

      <main class="view home-view">
        <div class="home-inner">
          <h1>Trade types</h1>
          <button class="home-card" data-type="multipliers">
            <b>Multipliers</b><span>Amplify your potential profit up to the multiplier, with losses limited to your stake.</span>
          </button>
          <button class="home-card" data-type="risefall">
            <b>Rise/Fall</b><span>Predict whether the exit spot will be higher or lower than the entry spot after a number of ticks.</span>
          </button>
          <p class="home-note">Demo only. Prices are generated in your browser and the balance has no monetary value.</p>
        </div>
      </main>

      <nav class="tabbar" id="tabbar">
        <button data-nav="home"><i data-icon="home"></i><span>Home</span></button>
        <button data-nav="trade"><i data-icon="trade"></i><span>Trade</span></button>
        <button data-nav="positions"><i data-icon="positions"></i><span>Positions</span><b class="badge" id="nav-badge" hidden>1</b></button>
        <button data-nav="menu"><i data-icon="menu"></i><span>Menu</span></button>
      </nav>

      <div class="toast" id="toast" hidden>
        <span class="toast-ico"></span>
        <span class="toast-text"><b id="toast-title"></b><span id="toast-sub"></span></span>
      </div>

      <div class="sheet-wrap" id="sheet-wrap" hidden>
        <div class="sheet" id="sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-title" id="sheet-title"></div>
          <div class="sheet-body" id="sheet-body"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
