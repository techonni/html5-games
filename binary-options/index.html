<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#1B2836" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pixelune Trader</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="phone" id="phone" data-view="trade">
      <!-- Cabeçalho normal -->
      <header class="hdr">
        <div class="logo">PX</div>
        <div class="acct">
          <div class="acct-type">Demo account</div>
          <div class="acct-bal" data-bind="balance">10,000.00 EUR</div>
        </div>
        <button class="btn-real" id="reset-btn">Reset</button>
      </header>

      <!-- Cabeçalho do modo de ecrã inteiro -->
      <header class="hdr-fs">
        <span class="sym-ico" data-bind="symIcon"></span>
        <div class="hdr-fs-sym">
          <div class="sym-name" data-bind="symName"></div>
          <div class="sym-sub" data-bind="tradeTypeName"></div>
        </div>
        <div class="acct acct-right">
          <div class="acct-type">Demo account</div>
          <div class="acct-bal" data-bind="balance"></div>
        </div>
      </header>

      <main class="view trade-view">
        <div class="sym-row">
          <button class="plus-btn" id="plus-btn" aria-label="Add"></button>
          <button class="sym-box" id="sym-box">
            <span class="sym-ico" data-bind="symIcon"></span>
            <span class="sym-text">
              <span class="sym-name" data-bind="symName"></span>
              <span class="sym-sub"><span data-bind="tradeTypeName"></span><i class="chev"></i></span>
            </span>
          </button>
        </div>

        <div class="chart" id="chart">
          <div class="chart-canvas" id="chart-canvas"></div>
          <button class="pl-pill" id="pl-pill" hidden>
            <span class="pl-count" id="pl-count">1</span>
            <span class="pl-label">P/L</span>
            <span class="pl-value" id="pl-value">€0.00</span>
            <i class="chev"></i>
          </button>
          <div class="expiry-pill" id="expiry-pill" hidden><span class="expiry-ico"></span><span id="expiry-time">0:00</span></div>
          <div class="chart-ctl">
            <button class="round-btn" id="chart-menu" aria-label="Chart settings"></button>
            <span class="interval-tag" id="interval-tag">1t</span>
          </div>
          <button class="round-btn expand-btn" id="expand-btn" aria-label="Full screen"></button>
        </div>

        <section class="panel">
          <div class="seg" id="dir-seg">
            <button data-dir="up" class="on"><span data-bind="upLabel">Up</span></button>
            <button data-dir="down"><span data-bind="downLabel">Down</span></button>
          </div>
          <div class="cards">
            <button class="card" id="card-1"><span class="card-label"></span><span class="card-value"></span></button>
            <button class="card" id="card-2"><span class="card-label"></span><span class="card-value"></span></button>
            <button class="card" id="card-3"><span class="card-label"></span><span class="card-value"></span></button>
          </div>
          <button class="buy-btn" id="buy-btn">Buy</button>
        </section>
      </main>

      <main class="view positions-view">
        <div class="tabs" id="pos-tabs">
          <button data-tab="open" class="on">Open</button>
          <button data-tab="closed">Closed</button>
        </div>
        <div class="pos-total">
          <span>Total profit/loss:</span>
          <span id="pos-total">0.00 EUR</span>
        </div>
        <div class="pos-list" id="pos-list"></div>
      </main>

      <main class="view home-view">
        <div class="home-inner">
          <h1>Trade types</h1>
          <button class="home-card" data-type="binary">
            <b>Binary</b><span>Up / Call or Down / Put with a fixed payout of 85%, decided by the price at the exact second of expiry (1–15 min). All or nothing.</span>
          </button>
          <button class="home-card" data-type="digital">
            <b>Digital</b><span>Choose a strike price: the further it is from the current price, the higher the payout. Win if the price ends beyond the strike.</span>
          </button>
          <button class="home-card" data-type="turbo">
            <b>Turbo</b><span>Very short binary options, from 30 seconds to 5 minutes, with an 80% payout.</span>
          </button>
          <button class="home-card" data-type="multipliers">
            <b>Multipliers</b><span>Amplify your potential profit up to the multiplier, with losses limited to your stake.</span>
          </button>
          <p class="home-note">Demo only. Prices are generated in your browser and the balance has no monetary value.</p>
        </div>
      </main>

      <nav class="tabbar" id="tabbar">
        <button data-nav="home"><i data-icon="home"></i><span>Home</span></button>
        <button data-nav="trade"><i data-icon="trade"></i><span>Trade</span></button>
        <button data-nav="positions"><i data-icon="positions"></i><span>Positions</span><b class="badge" id="nav-badge" hidden>1</b></button>
        <button data-nav="menu"><i data-icon="menu"></i><span>Menu</span></button>
      </nav>

    </div>

    <!-- Layout desktop (≥ 900px) -->
    <div class="desk" id="desk">
      <aside class="rail">
        <div class="logo">PX</div>
        <div class="rail-sep"></div>
        <button class="rail-btn" data-rail="home"><i data-icon="home"></i><span>Home</span></button>
        <button class="rail-btn" data-rail="positions"><i data-icon="positions"></i><span>Positions</span><b class="badge rail-badge" id="rail-badge" hidden>1</b></button>
        <button class="rail-btn" data-rail="reports"><i data-icon="reports"></i><span>Reports</span></button>
        <div class="rail-sep rail-sep-2"></div>
        <button class="rail-btn" data-rail="help"><i data-icon="help"></i><span>Help</span></button>
        <button class="rail-btn" data-rail="language"><i data-icon="language"></i><span>Language</span></button>
        <button class="rail-btn" data-rail="logout"><i data-icon="logout"></i><span>Log out</span></button>
      </aside>

      <section class="drawer" id="drawer" hidden>
        <header class="drawer-head"><b id="drawer-title">Positions</b><button id="drawer-close" aria-label="Close"></button></header>
        <div class="drawer-tabs" id="drawer-tabs">
          <button data-tab="open" class="on">Open</button>
          <button data-tab="closed">Closed</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <footer class="drawer-foot" id="drawer-foot">
          <span class="muted" id="drawer-count">0 open positions</span>
          <div class="drawer-total"><b>Total P/L:</b><b id="drawer-total">0.00 EUR</b></div>
        </footer>
      </section>

      <div class="d-main">
        <header class="d-top">
          <button class="d-plus" id="d-plus" aria-label="Add market"></button>
          <div class="d-tabs" id="d-tabs"></div>
          <div class="d-acct">
            <div class="acct-type">Demo account</div>
            <div class="acct-bal" data-bind="balance"></div>
          </div>
          <button class="btn-real d-real" id="d-reset">Reset</button>
        </header>
        <div class="d-body">
          <section class="d-chart" id="d-chart">
            <div class="d-tools">
              <button class="d-tool" id="t-type" aria-label="Chart type"><i data-icon="area"></i><span class="interval-tag" id="d-interval">1m</span></button>
              <button class="d-tool" id="t-draw" aria-label="Draw"><i data-icon="pencil"></i></button>
              <button class="d-tool" id="t-ind" aria-label="Indicators"><i data-icon="indicator"></i></button>
              <button class="d-tool" id="t-dl" aria-label="Download"><i data-icon="download"></i></button>
            </div>
            <div class="d-zoom">
              <button class="d-tool sm" id="z-out" aria-label="Zoom out"><i data-icon="minus"></i></button>
              <button class="d-tool sm" id="z-reset" aria-label="Reset view"><i data-icon="target"></i></button>
              <button class="d-tool sm" id="z-in" aria-label="Zoom in"><i data-icon="plusSm"></i></button>
            </div>
          </section>
          <aside class="d-panel">
            <button class="d-howto" id="d-howto"><span id="d-howto-text">How to trade Multipliers?</span><i data-icon="chevRight"></i></button>
            <div class="seg d-seg" id="d-seg">
              <button data-dir="up" class="on"><span data-bind="upLabel">Up</span></button>
              <button data-dir="down"><span data-bind="downLabel">Down</span></button>
            </div>
            <button class="d-card" id="d-card-1"><span class="d-card-label"></span><span class="d-card-value"></span></button>
            <button class="d-card" id="d-card-2"><span class="d-card-label"></span><span class="d-card-value"></span></button>
            <button class="d-card" id="d-card-3"><span class="d-card-label"></span><span class="d-card-value"></span></button>
            <div class="d-rows" id="d-rows"></div>
            <button class="buy-btn d-buy" id="d-buy">Buy</button>
            <footer class="d-foot">
              <span class="d-dot"></span><span id="d-date"></span>
              <span class="d-time" id="d-time"></span>
              <button id="d-fs" aria-label="Full screen"><i data-icon="fullscreen"></i></button>
            </footer>
          </aside>
        </div>
      </div>
    </div>
      <div class="toast" id="toast" hidden>
        <span class="toast-ico"></span>
        <span class="toast-text"><b id="toast-title"></b><span id="toast-sub"></span></span>
      </div>

      <div class="sheet-wrap" id="sheet-wrap" hidden>
        <div class="sheet" id="sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-title" id="sheet-title"></div>
          <div class="sheet-body" id="sheet-body"></div>
        </div>
      </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
