<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f1d3d6" />
    <title>Clumsy Monster</title>
    <link rel="icon" type="image/svg+xml" href="../clumsy-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="cards" id="cards">
      <section class="card welcome" id="welcome">
        <p class="kicker">Welcome to</p>
        <h1 class="title">CLUMSY<br />MONSTER<span class="dot"></span></h1>
        <div class="view3d view-welcome" id="view-welcome" aria-label="Your monster squad"></div>
        <button class="btn btn-pink" id="explore">Explore</button>
      </section>

      <section class="card choose" id="choose">
        <div class="hero">
          <div class="halo" id="halo"></div>
          <div class="view3d view-hero" id="view-hero" aria-label="Selected monster, drag to rotate, tap to make it trip"></div>
        </div>
        <h2 class="name" id="m-name">Duoceratops</h2>
        <div class="stats">
          <div><span>Strength</span><b id="s-0">90</b></div>
          <div><span>Agility</span><b id="s-1">124</b></div>
          <div><span>Intelligence</span><b id="s-2">83</b></div>
        </div>
        <p class="choose-label">Choose your monster</p>
        <div class="carousel">
          <button class="arrow" id="prev" aria-label="Previous monster"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3 5 8l5 5" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="thumbs" id="thumbs"></div>
          <button class="arrow" id="next" aria-label="Next monster"><svg viewBox="0 0 16 16" width="14" height="14"><path d="m6 3 5 5-5 5" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <button class="btn btn-dark" id="choose-btn">Choose</button>
      </section>
    </main>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
